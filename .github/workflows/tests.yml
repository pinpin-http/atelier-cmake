name: Automatisation des tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
      - name: Tests CTest
        run: ctest --test-dir build --output-on-failure

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
      - name: Run test "add" and capture report
        run: |
          cd build
          echo "Soheib Bouazzaoui" > report.txt
          echo "== Test add 10 5 ==" >> report.txt
          set +e
          ./src/calculator add 10 5 2>&1 | tee -a report.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "Exit code: $code" >> report.txt
          echo "Expected: 15.000000" >> report.txt
          test "$code" -eq 0
          grep -Fxq '15.000000' report.txt
      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-add-report
          path: build/report.txt
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        if: always()
        run: |
          echo '### Résultat du test add' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build/report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  Test_Sub:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
      - name: Test fonction sub
        run: ctest --test-dir build -R '^t2$' --output-on-failure -V

  Test_Mul:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
      - name: Test fonction mul
        run: ctest --test-dir build -R '^t3$' --output-on-failure -V

  Test_Div:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
      - name: Test fonction div
        run: ctest --test-dir build -R '^t4$' --output-on-failure -V

  Test_Car:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
      - name: Run test "car" and capture report
        run: |
          cd build
          echo "Soheib Bouazzaoui" > report.txt
          echo "== Test car 5 ==" >> report.txt
          set +e
          ./src/calculator car 5 2>&1 | tee -a report.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "Exit code: $code" >> report.txt
          echo "Expected: 25.000000" >> report.txt
          test "$code" -eq 0
          grep -Fxq '25.000000' report.txt
      - name: Tests des cas particuliers du carré
        run: ctest --test-dir build -R '^car_' --output-on-failure -V
      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-car-report
          path: build/report.txt
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        if: always()
        run: |
          echo '### Résultat du test car (carré)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build/report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  Deploy:
    runs-on: ubuntu-latest
    needs: [Test_Add, Test_Sub, Test_Mul, Test_Div, Test_Car]
    steps:
      - name: Déploiement
        run: echo "Déploiement de la solution"
